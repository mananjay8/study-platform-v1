<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">Study AI</div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>
    </header>


    <main class="app">

        <!-- Welcome -->
        <section id="welcome" class="welcome">

            <h1>What do you want to study?</h1>

            <p>
                Ask a question, upload study material,
                or tell Study AI what you want to learn.
            </p>

        </section>


        <!-- Chat -->
        <section id="chat" class="chat"></section>


        <!-- Quick Actions -->
        <div class="quick-actions">

            <button onclick="setPrompt('Create a quiz from this topic')">
                📝 Quiz
            </button>

            <button onclick="setPrompt('Explain this topic in simple language')">
                💡 Explain
            </button>

            <button onclick="setPrompt('Make short and useful notes')">
                📚 Notes
            </button>

            <button onclick="setPrompt('Create important practice questions')">
                ❓ Questions
            </button>

            <button onclick="setPrompt('Create flashcards for this topic')">
                🧠 Flashcards
            </button>

            <button onclick="setPrompt('Research this topic and give me a verified answer')">
                🔎 Research
            </button>

        </div>


        <!-- Input -->
        <div class="input-area">

            <div class="input-box">

                <button
                    class="upload-btn"
                    onclick="document.getElementById('fileInput').click()">
                    📎
                </button>

                <input
                    type="file"
                    id="fileInput"
                    hidden
                    accept=".pdf,.jpg,.jpeg,.png,.txt"
                    onchange="fileSelected(event)"
                >

                <textarea
                    id="userInput"
                    placeholder="Ask anything about your studies..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button
                    class="send-btn"
                    onclick="sendMessage()">
                    ➤
                </button>

            </div>

            <div id="fileInfo" class="file-info"></div>

            <p class="small-text">
                Study AI can work with your questions and study material.
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
