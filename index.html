<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Study Platform</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header class="header">

    <h1>Study Platform</h1>

    <p>Learn • Practice • Improve</p>

</header>


<main class="container">

    <section class="card">

        <h2>Choose Exam</h2>

        <div id="exam-list">
            Loading exams...
        </div>

    </section>


    <section id="quiz-section"
             class="card"
             hidden>

        <div class="quiz-top">

            <span id="question-number"></span>

            <span id="score">
                Score: 0
            </span>

        </div>


        <h2 id="question"></h2>

        <div id="options"></div>

        <div id="feedback"
             class="feedback">
        </div>


        <button id="next-button"
                class="next-button"
                hidden>
            Next Question
        </button>

    </section>


    <section id="result-section"
             class="card"
             hidden>

        <h2>Quiz Complete 🎉</h2>

        <div id="result"></div>

        <button id="restart-button"
                class="next-button">

            Back to Exams

        </button>

    </section>

</main>


<script src="script.js"></script>

</body>

</html>
