<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Study Platform</h1>
        <p>Learn • Practice • Improve</p>
    </header>

    <main class="container">

        <section class="quiz-card">

            <div class="quiz-top">
                <span id="question-number">Question 1</span>
                <span id="score">Score: 0</span>
            </div>

            <h2 id="question">
                Loading question...
            </h2>

            <div id="options"></div>

            <div id="feedback" class="feedback"></div>

            <button id="next-button" class="next-button" hidden>
                Next Question
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
