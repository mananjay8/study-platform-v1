<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Study AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f8fa;
    color: #202124;
    min-height: 100vh;
}

.topbar {
    height: 60px;
    background: white;
    border-bottom: 1px solid #ddd;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.new-chat {
    background: #111827;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
}

.app {
    width: min(900px, 94%);
    margin: auto;
    min-height: calc(100vh - 60px);

    display: flex;
    flex-direction: column;
}

.welcome {
    text-align: center;
    margin-top: 80px;
    margin-bottom: 35px;
}

.welcome h1 {
    font-size: 36px;
    margin-bottom: 12px;
}

.welcome p {
    color: #666;
    line-height: 1.5;
}

.chat {
    padding-bottom: 20px;
}

.message {
    display: flex;
    margin: 15px 0;
}

.message.user {
    justify-content: flex-end;
}

.message.ai {
    justify-content: flex-start;
}

.message-content {
    max-width: 80%;
    padding: 13px 16px;
    border-radius: 14px;
    line-height: 1.5;
}

.user .message-content {
    background: #111827;
    color: white;
}

.ai .message-content {
    background: white;
    border: 1px solid #ddd;
}

.quick-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.quick-actions button {
    border: 1px solid #ddd;
    background: white;
    padding: 9px 13px;
    border-radius: 20px;
    cursor: pointer;
}

.quick-actions button:hover {
    background: #eee;
}

.input-area {
    position: sticky;
    bottom: 0;
    background: #f7f8fa;
    padding-bottom: 15px;
}

.input-box {
    background: white;
    border: 1px solid #ccc;
    border-radius: 16px;

    min-height: 58px;

    display: flex;
    align-items: flex-end;

    padding: 8px;
}

textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;

    font-family: Arial, sans-serif;
    font-size: 16px;

    padding: 9px;
    min-height: 40px;
}

.upload-btn,
.send-btn {
    width: 40px;
    height: 40px;

    border: none;
    border-radius: 50%;

    cursor: pointer;
    font-size: 18px;
}

.upload-btn {
    background: transparent;
}

.send-btn {
    background: #111827;
    color: white;
}

.file-info {
    font-size: 13px;
    margin-top: 6px;
}

.small-text {
    text-align: center;
    color: #888;
    font-size: 11px;
    margin-top: 7px;
}

@media (max-width: 600px) {

    .welcome {
        margin-top: 55px;
    }

    .welcome h1 {
        font-size: 29px;
    }

    .quick-actions {
        overflow-x: auto;
        flex-wrap: nowrap;
    }

    .quick-actions button {
        white-space: nowrap;
    }
}
</style>

</head>

<body>

<header class="topbar">

    <div class="logo">
        Study AI
    </div>

    <button class="new-chat" onclick="newChat()">
        + New Chat
    </button>

</header>


<main class="app">

    <section id="welcome" class="welcome">

        <h1>
            What do you want to study?
        </h1>

        <p>
            Ask a question, upload study material,
            or tell Study AI what you want to learn.
        </p>

    </section>


    <section id="chat" class="chat"></section>


    <div class="quick-actions">

        <button onclick="setPrompt('Create a quiz from this topic')">
            📝 Quiz
        </button>

        <button onclick="setPrompt('Explain this topic in simple language')">
            💡 Explain
        </button>

        <button onclick="setPrompt('Make short and useful notes')">
            📚 Notes
        </button>

        <button onclick="setPrompt('Create important practice questions')">
            ❓ Questions
        </button>

        <button onclick="setPrompt('Create flashcards for this topic')">
            🧠 Flashcards
        </button>

        <button onclick="setPrompt('Research this topic and give me a verified answer')">
            🔎 Research
        </button>

    </div>


    <div class="input-area">

        <div class="input-box">

            <button
                class="upload-btn"
                onclick="document.getElementById('fileInput').click()">
                📎
            </button>

            <input
                type="file"
                id="fileInput"
                hidden
                accept=".pdf,.jpg,.jpeg,.png,.txt"
                onchange="fileSelected(event)"
            >

            <textarea
                id="userInput"
                placeholder="Ask anything about your studies..."
                rows="1"
            ></textarea>

            <button
                class="send-btn"
                onclick="sendMessage()">
                ➤
            </button>

        </div>

        <div id="fileInfo" class="file-info"></div>

        <p class="small-text">
            Study AI can work with your questions and study material.
        </p>

    </div>

</main>


<script>

const input = document.getElementById("userInput");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const fileInfo = document.getElementById("fileInfo");


function sendMessage() {

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    welcome.style.display = "none";

async function sendMessage() {

    const text = input.value.trim();

    if (text === "") {
        return;
    }

    addMessage(text, "user");

    input.value = "";

    welcome.style.display = "none";


    const loadingId = "loading-" + Date.now();

    addMessage("⏳ AI सोच रहा है...", "ai");

    const loadingMessage =
        chat.lastElementChild.querySelector(".message-content");

    loadingMessage.id = loadingId;


    try {

        const response = await fetch("/api/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })

        });


        const data = await response.json();


        const loadingElement =
            document.getElementById(loadingId);


        if (loadingElement) {
            loadingElement.textContent =
                data.answer || ("❌ " + (data.error || "Unknown error"));
        }


    } catch (error) {

        const loadingElement =
            document.getElementById(loadingId);


        if (loadingElement) {

            loadingElement.textContent =
                "❌ Server से connection नहीं हो पाया।";
        }

        console.error(error);
    }
}
    
}


function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;


    const content = document.createElement("div");

    content.className = "message-content";

    content.textContent = text;


    message.appendChild(content);

    chat.appendChild(message);


    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
}


function setPrompt(text) {

    input.value = text;

    input.focus();
}


function fileSelected(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    fileInfo.textContent =
        "📎 Selected: " + file.name;

    welcome.style.display = "none";


    addMessage(
        "📎 File selected: " + file.name,
        "user"
    );


    setTimeout(function() {

        addMessage(
            "File selection काम कर रहा है। अगली phase में file को AI के साथ process करेंगे।",
            "ai"
        );

    }, 500);
}


function newChat() {

    chat.innerHTML = "";

    welcome.style.display = "block";

    input.value = "";

    fileInfo.textContent = "";
}


input.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendMessage();
    }

});

</script>

</body>
</html>
